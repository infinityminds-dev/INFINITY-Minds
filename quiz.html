<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Brain-Gym | Weekly League</title>
    <link rel="stylesheet" href="quiz.css">
   
</head>
<body>

    <header class="gym-header">
        <div class="stats-container">
            <div class="stat-box">👤 <span id="display-name">Explorer</span></div>
            <div class="stat-box">❤️ <span id="user-hearts">3</span></div>
            <div class="stat-box">🔥 <span id="user-xp">0</span></div>
            <div class="stat-box">🏆 <span id="user-level">1</span></div>
        </div>
        <h1>⚡ INFINITY Brain-Gym</h1>
    </header>

    <main class="container">
        
        <div id="login-screen" class="card">
            <h3>🎮 Join the Gym</h3>
            <p style="font-size: 14px; opacity: 0.8; margin-bottom: 20px;">Login to save your progress and join the Global Leaderboard!</p>
            <button class="btn-main" onclick="loginWithGoogle()">
                Continue with Google 🚀
            </button>
        </div>

        <div id="timer-screen" class="card" style="display: none;">
            <h2 style="color:#ef4444;">⏳ Hearts Empty!</h2>
            <p>Wait for refill to play again.</p>
            <div id="countdown-display" class="timer-countdown">00:00:00</div>
            <p style="font-size: 12px; opacity: 0.6;">Next Heart in 3 hours ⏱️</p>
        </div>

        <div id="main-game-area" style="display: none;">
            <div id="game-container">
                </div>
            <button class="btn-next" onclick="generateNextChallenge()">Skip Challenge ➡️</button>
        </div>

        <br> 
        
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
            <button class="btn-main" style="flex: 1;" onclick="window.location.href='home.html'">Back Home 🏠</button>
            <button class="btn-main" style="flex: 1; background:#475569;" onclick="logout()">Logout 🚪</button>
        </div>
        
        <div class="card leaderboard-card">
            <h3>🥇 Global Champions</h3>
            <div class="refresh-notice">⏳ Monday to Monday Leaderboard will Refresh</div>
            
            <ul id="leaderboard-list">
                <p style="font-size:12px; color:gray; text-align:center;">Loading scores...</p>
            </ul>
        </div>
    </main>

    <script type="module" src="quiz.js"></script>
</body>
</html>
