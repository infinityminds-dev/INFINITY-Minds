<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Brain-Gym | Weekly League</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>

    <header class="gym-header">
        <div class="stats-container">
            <div class="stat-box">❤️ <span id="user-hearts">3</span></div>
            <div class="stat-box">🔥 XP: <span id="user-xp">0</span></div>
            <div class="stat-box">🏆 Lvl: <span id="user-level">1</span></div>
        </div>
        <h1>⚡ INFINITY Brain-Gym</h1>
    </header>

    <main class="container">
        <div id="timer-screen" class="card" style="display: none;">
            <h2 style="color:#ef4444;">⏳ Hearts Empty!</h2>
            <p>Wait for refill to play again.</p>
            <div id="countdown-display" class="timer-countdown">00:00:00</div>
            <p style="font-size: 12px; opacity: 0.6;">Refill takes 3 hours ⏱️</p>
        </div>

        <div id="entry-lock" class="card">
            <h3>🎮 Welcome Player</h3>
            <input type="text" id="user-name-input" placeholder="Enter Ninja Name...">
            <button class="btn-main" onclick="unlockGym()">Enter Gym 🔓</button>
        </div>

        <div id="main-game-area" style="display: none;">
            <div id="game-container"></div>
            <button class="btn-next" onclick="generateNextChallenge()">Skip ➡️</button>
        </div>
        <br> 
        
        <button class="btn-main" onclick="window.location.href='home.html'">Back To Page 🔙</button>
        
        <div class="card leaderboard-card">
            <h3>🥇 Global Champions</h3>
            <ul id="leaderboard-list"></ul>
        </div>
    </main>

    <script type="module" src="quiz.js"></script>
</body>
</html>
